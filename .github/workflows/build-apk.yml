name: Build The Last Floor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/thelastfloor/game
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'TheLastFloor'
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '9.4.0' apply false
          }
          GRADLE

          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          PROPS

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.thelastfloor.game'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.thelastfloor.game'
                  minSdk 23
                  targetSdk 36
                  versionCode 1
                  versionName '0.1.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                  }
              }
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="The Last Floor"
                  android:allowBackup="false"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
              </style>
          </resources>
          XML

          cat > app/src/main/java/com/thelastfloor/game/MainActivity.java <<'JAVA'
          package com.thelastfloor.game;

          import android.app.Activity;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.PointF;
          import android.os.Bundle;
          import android.view.MotionEvent;
          import android.view.View;

          import java.util.ArrayList;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );
                  setContentView(new GameView(this));
              }

              static class GameView extends View {
                  private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint outline = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final ArrayList<PointF> parts = new ArrayList<>();
                  private final boolean[] collected = new boolean[6];

                  private float playerX;
                  private float playerY;
                  private float joystickX;
                  private float joystickY;
                  private float stickX;
                  private float stickY;
                  private boolean joystickHeld;
                  private boolean running;
                  private int helicopterParts;
                  private String message = "Find the helicopter parts.";
                  private long messageUntil;
                  private long lastFrame = System.currentTimeMillis();

                  GameView(Context context) {
                      super(context);
                      setBackgroundColor(Color.BLACK);
                      outline.setStyle(Paint.Style.STROKE);
                      outline.setStrokeWidth(3f);
                  }

                  @Override
                  protected void onSizeChanged(int w, int h, int oldw, int oldh) {
                      playerX = w * 0.50f;
                      playerY = h * 0.50f;
                      joystickX = Math.min(130f, w * 0.16f);
                      joystickY = h - Math.min(100f, h * 0.22f);
                      stickX = joystickX;
                      stickY = joystickY;
                      rebuildParts(w, h);
                  }

                  private void rebuildParts(int w, int h) {
                      parts.clear();
                      float left = w * 0.25f;
                      float right = w * 0.75f;
                      float y1 = Math.max(150f, h * 0.32f);
                      float y2 = Math.max(230f, h * 0.56f);
                      float y3 = Math.max(300f, h * 0.78f);
                      parts.add(new PointF(left, y1));
                      parts.add(new PointF(right, y1));
                      parts.add(new PointF(left, y2));
                      parts.add(new PointF(right, y2));
                      parts.add(new PointF(left, y3));
                      parts.add(new PointF(right, y3));
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      long now = System.currentTimeMillis();
                      float delta = Math.min(0.05f, (now - lastFrame) / 1000f);
                      lastFrame = now;

                      updatePlayer(delta);
                      drawHotel(canvas);
                      drawParts(canvas);
                      drawPlayer(canvas);
                      drawUI(canvas);
                      postInvalidateDelayed(16);
                  }

                  private void updatePlayer(float delta) {
                      if (!joystickHeld) return;

                      float dx = stickX - joystickX;
                      float dy = stickY - joystickY;
                      float length = (float) Math.sqrt(dx * dx + dy * dy);
                      if (length <= 8f) return;

                      dx /= length;
                      dy /= length;
                      float speed = running ? 220f : 120f;
                      playerX += dx * speed * delta;
                      playerY += dy * speed * delta;

                      playerX = Math.max(20f, Math.min(getWidth() - 20f, playerX));
                      playerY = Math.max(75f, Math.min(getHeight() - 20f, playerY));
                      checkParts();
                  }

                  private void checkParts() {
                      for (int i = 0; i < parts.size(); i++) {
                          if (collected[i]) continue;
                          PointF part = parts.get(i);
                          float dx = playerX - part.x;
                          float dy = playerY - part.y;
                          if (dx * dx + dy * dy < 45f * 45f) {
                              collected[i] = true;
                              helicopterParts++;
                              showMessage("Helicopter part found!");
                              break;
                          }
                      }
                  }

                  private void drawHotel(Canvas canvas) {
                      int width = getWidth();
                      int height = getHeight();
                      float corridorLeft = width * 0.43f;
                      float corridorRight = width * 0.57f;

                      paint.setColor(Color.rgb(18, 17, 22));
                      canvas.drawRect(0, 0, width, height, paint);
                      paint.setColor(Color.rgb(30, 29, 36));
                      canvas.drawRect(corridorLeft, 70f, corridorRight, height, paint);

                      int rows = Math.max(2, (height - 110) / 130);
                      float storeHeight = Math.min(115f, (height - 110f) / rows - 12f);
                      for (int row = 0; row < rows; row++) {
                          float top = 85f + row * (storeHeight + 12f);
                          float bottom = top + storeHeight;
                          drawStore(canvas, 40f, top, corridorLeft - 15f, bottom);
                          drawStore(canvas, corridorRight + 15f, top, width - 40f, bottom);
                      }

                      paint.setColor(Color.rgb(90, 10, 15));
                      canvas.drawRect(width * 0.5f - 50f, 18f, width * 0.5f + 50f, 53f, paint);
                      paint.setColor(Color.WHITE);
                      paint.setTextAlign(Paint.Align.CENTER);
                      paint.setTextSize(18f);
                      canvas.drawText("ROOF", width * 0.5f, 42f, paint);
                  }

                  private void drawStore(Canvas canvas, float left, float top, float right, float bottom) {
                      outline.setColor(Color.rgb(70, 67, 75));
                      canvas.drawRect(left, top, right, bottom, outline);
                      paint.setColor(Color.rgb(95, 69, 56));
                      canvas.drawRect(left - 3f, top + 25f, left + 9f, top + 75f, paint);
                      canvas.drawRect(right - 9f, top + 25f, right + 3f, top + 75f, paint);
                  }

                  private void drawParts(Canvas canvas) {
                      paint.setColor(Color.rgb(190, 165, 35));
                      for (int i = 0; i < parts.size(); i++) {
                          if (collected[i]) continue;
                          PointF p = parts.get(i);
                          canvas.drawCircle(p.x, p.y, 10f, paint);
                      }
                  }

                  private void drawPlayer(Canvas canvas) {
                      paint.setColor(Color.rgb(220, 220, 225));
                      canvas.drawCircle(playerX, playerY, 15f, paint);
                      outline.setColor(Color.WHITE);
                      canvas.drawCircle(playerX, playerY, 15f, outline);
                  }

                  private void drawUI(Canvas canvas) {
                      int width = getWidth();
                      int height = getHeight();

                      paint.setColor(Color.argb(215, 8, 8, 12));
                      canvas.drawRoundRect(15f, 15f, Math.min(520f, width - 170f), 95f, 14f, 14f, paint);

                      paint.setColor(Color.WHITE);
                      paint.setTextAlign(Paint.Align.LEFT);
                      paint.setTextSize(20f);
                      canvas.drawText("THE LAST FLOOR", 30f, 43f, paint);
                      paint.setTextSize(13f);
                      String objective = helicopterParts == 6 ? "All parts found. Reach the ROOF." : "Find helicopter parts.";
                      canvas.drawText(objective, 30f, 70f, paint);

                      paint.setTextAlign(Paint.Align.RIGHT);
                      paint.setTextSize(17f);
                      canvas.drawText("PARTS: " + helicopterParts + "/6", width - 20f, 40f, paint);

                      paint.setColor(Color.argb(95, 190, 190, 200));
                      canvas.drawCircle(joystickX, joystickY, 68f, paint);
                      paint.setColor(Color.argb(175, 220, 220, 225));
                      canvas.drawCircle(stickX, stickY, 28f, paint);

                      float runLeft = width - 170f;
                      float runTop = height - 105f;
                      paint.setColor(Color.argb(150, 140, 20, 25));
                      canvas.drawRoundRect(runLeft, runTop, width - 20f, height - 30f, 16f, 16f, paint);
                      paint.setColor(Color.WHITE);
                      paint.setTextAlign(Paint.Align.CENTER);
                      paint.setTextSize(21f);
                      canvas.drawText("RUN", (runLeft + width - 20f) / 2f, runTop + 47f, paint);

                      if (System.currentTimeMillis() < messageUntil) {
                          paint.setColor(Color.argb(225, 5, 5, 7));
                          canvas.drawRoundRect(width * 0.25f, height - 80f, width * 0.75f, height - 35f, 12f, 12f, paint);
                          paint.setColor(Color.WHITE);
                          paint.setTextSize(15f);
                          canvas.drawText(message, width * 0.5f, height - 51f, paint);
                      }
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent event) {
                      float x = event.getX();
                      float y = event.getY();
                      float runLeft = getWidth() - 190f;
                      float runTop = getHeight() - 130f;

                      switch (event.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              if (x < getWidth() * 0.42f && y > getHeight() * 0.50f) {
                                  joystickHeld = true;
                                  updateJoystick(x, y);
                              } else if (x > runLeft && y > runTop) {
                                  running = true;
                              }
                              return true;
                          case MotionEvent.ACTION_MOVE:
                              if (joystickHeld) updateJoystick(x, y);
                              return true;
                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              joystickHeld = false;
                              running = false;
                              stickX = joystickX;
                              stickY = joystickY;
                              return true;
                          default:
                              return true;
                      }
                  }

                  private void updateJoystick(float x, float y) {
                      float dx = x - joystickX;
                      float dy = y - joystickY;
                      float length = (float) Math.sqrt(dx * dx + dy * dy);
                      float maxDistance = 60f;
                      if (length > maxDistance) {
                          dx = dx / length * maxDistance;
                          dy = dy / length * maxDistance;
                      }
                      stickX = joystickX + dx;
                      stickY = joystickY + dy;
                  }

                  private void showMessage(String text) {
                      message = text;
                      messageUntil = System.currentTimeMillis() + 3000L;
                  }
              }
          }
          JAVA

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Validate Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace help

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Last-Floor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
