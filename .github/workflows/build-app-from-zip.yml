name: Build APK from skyline-hotel-game.zip

on:
  workflow_dispatch:
  push:
    paths:
      - 'skyline-hotel-game.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check zip exists
        run: |
          if [ ! -f skyline-hotel-game.zip ]; then
            echo "❌ skyline-hotel-game.zip not found in repo root"
            ls -la
            exit 1
          fi
          echo "✅ Found skyline-hotel-game.zip"
          ls -lh skyline-hotel-game.zip

      - name: Unzip game
        run: |
          rm -rf www extracted
          unzip -o skyline-hotel-game.zip -d extracted
          echo "=== Unzipped contents ==="
          find extracted -type f | sort

          if [ -d extracted/www ]; then
            mv extracted/www ./www
          elif [ -f extracted/index.html ]; then
            mkdir -p www
            mv extracted/* www/
          else
            INDEX=$(find extracted -name "index.html" | head -1)
            if [ -z "$INDEX" ]; then
              echo "❌ No index.html found inside the zip"
              find extracted -print
              exit 1
            fi
            DIR=$(dirname "$INDEX")
            mkdir -p www
            cp -r "$DIR"/* www/
          fi

          echo "=== Final www folder ==="
          find www -type f | sort
          test -f www/index.html && echo "✅ www/index.html ready"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Create Capacitor project files
        run: |
          cat > package.json << 'EOP'
          {
            "name": "skyline-hotel",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/core": "^6.1.2",
              "@capacitor/cli": "^6.1.2"
            }
          }
          EOP

          cat > capacitor.config.json << 'EOC'
          {
            "appId": "com.skyline.hotel",
            "appName": "Skyline Hotel",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOC

          echo "✅ Project files created"

      - name: Install & sync Capacitor
        run: |
          npm install
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
          echo "=== Looking for APK ==="
          find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkylineHotel-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Done
        run: |
          echo "## ✅ Real APK built" >> $GITHUB_STEP_SUMMARY
          echo "Download the artifact **SkylineHotel-APK**" >> $GITHUB_STEP_SUMMARY
          ls -lh android/app/build/outputs/apk/debug/ || true
