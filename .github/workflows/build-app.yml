name: Build Skyline Hotel App

on:
  workflow_dispatch:
  push:
    paths:
      - 'skyline-hotel-game.zip'
      - '.github/workflows/build-app.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - show repo contents
        run: |
          echo "=== Repo contents ==="
          ls -la
          find . -name "*.zip" -type f

      - name: Check for skyline-hotel-game.zip
        run: |
          if [ ! -f skyline-hotel-game.zip ]; then
            echo "❌ skyline-hotel-game.zip not found!"
            exit 1
          fi
          echo "✅ Found skyline-hotel-game.zip"
          ls -lh skyline-hotel-game.zip
          unzip -l skyline-hotel-game.zip | head -40

      - name: Unzip the game (robust)
        run: |
          rm -rf hotel-game extracted
          mkdir -p extracted
          unzip -o skyline-hotel-game.zip -d extracted

          echo "=== Full tree after unzip ==="
          find extracted -type f | sort

          if [ -d extracted/hotel-game ] && [ -f extracted/hotel-game/index.html ]; then
            echo "✅ Found hotel-game/ folder"
            mv extracted/hotel-game ./hotel-game
          elif [ -f extracted/index.html ]; then
            echo "✅ Found index.html at root"
            mkdir -p hotel-game
            mv extracted/* hotel-game/ 2>/dev/null || true
          else
            INDEX_PATH=$(find extracted -name "index.html" -type f | head -1)
            if [ -z "$INDEX_PATH" ]; then
              echo "❌ Could not find index.html"
              find extracted -print
              exit 1
            fi
            echo "Found index.html at: $INDEX_PATH"
            PARENT_DIR=$(dirname "$INDEX_PATH")
            mkdir -p hotel-game
            cp -r "$PARENT_DIR"/* hotel-game/
          fi

          echo "=== Final hotel-game contents ==="
          find hotel-game -type f | sort

      - name: Verify required files
        run: |
          required=("index.html" "js/main.js" "css/style.css" "manifest.json")
          for f in "${required[@]}"; do
            if [ ! -f "hotel-game/$f" ]; then
              echo "❌ Missing: hotel-game/$f"
              find hotel-game -print || true
              exit 1
            fi
            echo "✅ Found hotel-game/$f"
          done

      - name: Make installable PWA
        run: |
          cd hotel-game

          cat > manifest.json << 'EOF'
          {
            "name": "Skyline Hotel – Escape",
            "short_name": "SkylineHotel",
            "start_url": "./index.html",
            "display": "standalone",
            "orientation": "any",
            "background_color": "#050505",
            "theme_color": "#1a0000",
            "icons": [
              { "src": "icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any maskable" },
              { "src": "icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
            ]
          }
          EOF

          cat > sw.js << 'EOF'
          const CACHE = 'skyline-hotel-v1';
          const ASSETS = ['./', './index.html', './css/style.css', './js/main.js', './manifest.json'];
          self.addEventListener('install', e => e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
          self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
          EOF

          if ! grep -q "serviceWorker" index.html; then
            sed -i 's|</body>|<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js")}</script>\n</body>|' index.html
          fi

      - name: Create icons
        run: |
          cd hotel-game
          python3 -c '
          import struct, zlib
          def make_png(size, filename):
              raw = b""
              for y in range(size):
                  raw += b"\x00"
                  for x in range(size):
                      raw += b"\x1a\x00\x00\xff"
              def chunk(tag, data):
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
              open(filename, "wb").write(png)
          make_png(192, "icon-192.png")
          make_png(512, "icon-512.png")
          '

      - name: Prepare final app
        run: |
          rm -rf dist
          mkdir -p dist/SkylineHotel
          cp -r hotel-game/* dist/SkylineHotel/

          cat > dist/SkylineHotel/HOW-TO-INSTALL.txt << 'EOF'
          SKYLINE HOTEL – ESCAPE

          This is a complete PWA (Progressive Web App).

          Quick install on phone:
          1. Upload this folder to Netlify / GitHub Pages / Vercel
          2. Open the link on your phone
          3. Tap "Add to Home Screen"

          To make a real APK:
          1. Install Node.js
          2. npm install -g @capacitor/cli
          3. Inside this folder run:
             npx cap init "Skyline Hotel" com.skyline.hotel
             npx cap add android
             npx cap sync
             npx cap open android
          4. In Android Studio → Build → Build APK / Bundle
          EOF

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: SkylineHotel-App
          path: dist/SkylineHotel/
          retention-days: 30
