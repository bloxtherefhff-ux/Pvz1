# .github/workflows/build-app.yml
# Automatically unzips skyline-hotel-game.zip and prepares the mobile app
# Just put (or rename) your zip as skyline-hotel-game.zip in the repo root
# Then run the Action → download the ready app

name: Build Skyline Hotel App

on:
  workflow_dispatch:          # Manual run button
  push:
    paths:
      - 'skyline-hotel-game.zip'
      - '.github/workflows/build-app.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for skyline-hotel-game.zip
        id: check
        run: |
          if [ ! -f skyline-hotel-game.zip ]; then
            echo "❌ skyline-hotel-game.zip not found in repo root!"
            echo "Please upload or rename your zip to exactly: skyline-hotel-game.zip"
            exit 1
          fi
          echo "✅ Found skyline-hotel-game.zip"
          ls -lh skyline-hotel-game.zip

      - name: Unzip the game
        run: |
          echo "Unpacking skyline-hotel-game.zip ..."
          rm -rf hotel-game extracted
          unzip -q skyline-hotel-game.zip -d extracted
          
          # Handle both possible structures:
          # 1) zip contains hotel-game/ folder
          # 2) zip contains the files directly
          if [ -d extracted/hotel-game ]; then
            mv extracted/hotel-game ./hotel-game
          else
            mkdir -p hotel-game
            mv extracted/* hotel-game/ 2>/dev/null || true
          fi
          
          echo "=== Game structure ==="
          find hotel-game -type f | head -30
          echo ""
          ls -la hotel-game/

      - name: Verify required files
        run: |
          required=("index.html" "js/main.js" "css/style.css" "manifest.json")
          for f in "${required[@]}"; do
            if [ ! -f "hotel-game/$f" ]; then
              echo "❌ Missing required file: hotel-game/$f"
              exit 1
            fi
          done
          echo "✅ All core files present"

      - name: Make it a proper installable PWA
        run: |
          cd hotel-game
          
          # Ensure manifest is solid
          cat > manifest.json << 'EOF'
          {
            "name": "Skyline Hotel – Escape",
            "short_name": "SkylineHotel",
            "description": "Explore a 10-floor abandoned hotel, collect helicopter parts, reach the roof.",
            "start_url": "./index.html",
            "display": "standalone",
            "orientation": "any",
            "background_color": "#050505",
            "theme_color": "#1a0000",
            "icons": [
              {
                "src": "icon-192.png",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any maskable"
              },
              {
                "src": "icon-512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
              }
            ]
          }
          EOF

          # Simple service worker for offline + install
          cat > sw.js << 'EOF'
          const CACHE = 'skyline-hotel-v1';
          const ASSETS = [
            './',
            './index.html',
            './css/style.css',
            './js/main.js',
            './manifest.json'
          ];
          self.addEventListener('install', e => {
            e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
          });
          self.addEventListener('fetch', e => {
            e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
          });
          EOF

          # Register service worker in index.html if not already present
          if ! grep -q "serviceWorker" index.html; then
            sed -i 's|</body>|<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js")}</script>\n</body>|' index.html
          fi

          echo "✅ PWA files ready (manifest + service worker)"

      - name: Create simple placeholder icons (so install works)
        run: |
          cd hotel-game
          # Tiny valid PNG placeholders (1x1 dark pixel expanded conceptually)
          # Real icons can be replaced later
          python3 -c '
          import struct, zlib
          def make_png(size, filename):
              # Solid dark red square
              raw = b""
              for y in range(size):
                  raw += b"\x00"  # filter
                  for x in range(size):
                      raw += b"\x1a\x00\x00\xff"  # RGBA
              def chunk(tag, data):
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
              open(filename, "wb").write(png)
          make_png(192, "icon-192.png")
          make_png(512, "icon-512.png")
          print("Icons created")
          '

      - name: Prepare final app folder
        run: |
          rm -rf dist
          mkdir -p dist/SkylineHotel
          cp -r hotel-game/* dist/SkylineHotel/
          
          # Add a clear README for the user
          cat > dist/SkylineHotel/HOW-TO-INSTALL.txt << 'EOF'
          SKYLINE HOTEL – ESCAPE
          ======================

          This folder is a complete mobile-ready web app (PWA).

          OPTION 1 – Instant play (any phone/PC)
          --------------------------------------
          1. Upload this whole folder to any static host
             (Netlify, GitHub Pages, Vercel, itch.io, etc.)
          2. Open the link on your phone → browser will offer "Add to Home Screen"
          3. It installs like a real app and works offline.

          OPTION 2 – Real Android APK (recommended for stores)
          ----------------------------------------------------
          1. Install Node.js
          2. npm install -g @capacitor/cli
          3. In this folder run:
               npx cap init "Skyline Hotel" com.skyline.hotel
               npx cap add android
               npx cap sync
               npx cap open android
          4. In Android Studio → Build → Generate Signed Bundle / APK

          OPTION 3 – Just test locally
          ----------------------------
          Open index.html in Chrome / Safari on your phone or computer.
          EOF

          echo "=== Final app contents ==="
          find dist/SkylineHotel -type f

      - name: Upload the ready app
        uses: actions/upload-artifact@v4
        with:
          name: SkylineHotel-App
          path: dist/SkylineHotel/
          retention-days: 30

      - name: Summary
        run: |
          echo "## ✅ Skyline Hotel App is ready!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Source zip: \`skyline-hotel-game.zip\`" >> $GITHUB_STEP_SUMMARY
          echo "- Output artifact: **SkylineHotel-App**" >> $GITHUB_STEP_SUMMARY
          echo "- Contains full PWA (installable on phone) + instructions for real APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the artifact, unzip it, and follow HOW-TO-INSTALL.txt" >> $GITHUB_STEP_SUMMARY
