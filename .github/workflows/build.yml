name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for zip
        run: |
          ls -la
          if [ ! -f skyline-hotel-game.zip ]; then
            echo "skyline-hotel-game.zip is missing!"
            exit 1
          fi

      - name: Unzip
        run: |
          rm -rf www
          unzip -o skyline-hotel-game.zip -d temp
          if [ -d temp/www ]; then
            mv temp/www ./www
          else
            mkdir www
            cp -r temp/* www/ || true
          fi
          find www -type f
          test -f www/index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Create project files
        run: |
          cat > package.json << 'EOF'
          {
            "name": "skyline-hotel",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.1.2",
              "@capacitor/core": "6.1.2",
              "@capacitor/cli": "6.1.2"
            }
          }
          EOF

          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.skyline.hotel",
            "appName": "Skyline Hotel",
            "webDir": "www"
          }
          EOF

      - name: Install and sync
        run: |
          npm install
          npx cap add android
          npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkylineHotel-APK
          path: android/app/build/outputs/apk/debug/*.apk
